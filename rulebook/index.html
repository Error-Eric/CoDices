<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CoDices 规则书速查：技能、怪物与武器。" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f7f1e7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>规则书 · CoDices</title>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var requested = params.get('theme');
          var saved = localStorage.getItem('CoDices:ui-theme');
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = requested === 'light' || requested === 'dark'
            ? requested
            : saved === 'light' || saved === 'dark'
              ? saved
              : dark
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', theme === 'dark' ? '#14120f' : '#f7f1e7');
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div class="rb-app">
      <header class="rb-header">
        <a class="rb-brand" href="../" aria-label="返回 CoDices 编辑器">
          <span class="rb-brand-mark" data-icon="book" data-icon-size="20"></span>
          <span class="rb-brand-text">
            <strong>CoDices</strong>
            <small>规则书速查</small>
          </span>
        </a>

        <nav class="rb-tabs" id="rb-tabs" role="tablist" aria-label="规则书分类"></nav>

        <div class="rb-actions">
          <a class="rb-btn" href="../">
            <span data-icon="external" data-icon-size="15"></span>
            <span>编辑器</span>
          </a>
          <button
            class="rb-icon-button"
            id="rb-theme"
            type="button"
            data-icon="moon"
            data-icon-size="17"
            title="切换明暗主题"
            aria-label="切换明暗主题"
          ></button>
        </div>
      </header>

      <main class="rb-main">
        <section class="rb-hero" aria-labelledby="rb-title">
          <p class="rb-kicker">Call of Cthulhu 7e</p>
          <h1 id="rb-title">规则书速查</h1>
          <p class="rb-lede">技能、怪物与武器。写给守秘人的中文桌边参考。</p>
          <div class="rb-stats" id="rb-stats"></div>
        </section>

        <div class="rb-toolbar">
          <label class="rb-search" for="rb-search">
            <svg
              class="rb-search-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M20 20l-3.6-3.6"></path>
            </svg>
            <input
              id="rb-search"
              type="search"
              placeholder="搜索技能、专攻或规则…"
              autocomplete="off"
              spellcheck="false"
            />
          </label>
          <div class="rb-filters" id="rb-filters" aria-label="筛选"></div>
        </div>

        <div class="rb-content" id="rb-content"></div>
      </main>

      <footer class="rb-footer">
        <p>数据整理自 Call of Cthulhu 7e 中文规则书，仅供速查与备团使用。</p>
        <p class="rb-footer-note">原始转录文本不随项目发布。</p>
      </footer>
    </div>

    <div class="rb-overlay" id="rb-overlay" hidden>
      <div class="rb-overlay-backdrop" data-overlay-close></div>
      <div
        class="rb-overlay-panel"
        id="rb-overlay-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="rb-overlay-title"
        tabindex="-1"
      >
        <header class="rb-overlay-head">
          <div class="rb-overlay-heading">
            <p class="rb-overlay-kicker" id="rb-overlay-kicker">技能</p>
            <h2 id="rb-overlay-title"></h2>
            <p class="rb-overlay-subtitle" id="rb-overlay-subtitle" hidden></p>
          </div>
          <div class="rb-overlay-actions">
            <span class="rb-base" id="rb-overlay-base"></span>
            <button
              class="rb-overlay-close"
              type="button"
              data-overlay-close
              aria-label="关闭详情"
            >
              <span data-icon="x" data-icon-size="18"></span>
            </button>
          </div>
        </header>
        <div class="rb-overlay-body" id="rb-overlay-body"></div>
      </div>
    </div>

    <script type="module" src="/src/rulebook/main.ts"></script>
  </body>
</html>
